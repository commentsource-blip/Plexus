name: Keep Streamlit App Awake

on:
  schedule:
    # Kører hver 10. time (godt under Streamlits 12-timers dvale-grænse)
    - cron: '0 */10 * * *'
  workflow_dispatch:  # Tillader manuel kørsel fra GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          echo "Pinger Plexus Vagtplan..."
          curl -sSf --max-time 30 "https://plexus.streamlit.app/" -o /dev/null \
            && echo "✅ App er vågen" \
            || echo "⚠️ App svarede ikke (måske i gang med at vågne)"
